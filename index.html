<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS STORE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- الهيدر -->
  <header class="header">
    <div class="logo-box">
      <img src="images/logo.png" alt="SOS STORE Logo">
      <title>SOS STORE | متجر الإكسسوارات</title>
    </div>
    <p class="subtitle">أفضل المنتجات بأفضل الأسعار</p>
  </header>

  <!-- المنتجات -->
  <section class="products">

    <div class="product">
      <img src="images/product1.jpeg" alt="منتج 1">
      <h3>كفر موبايل نار</h3>
      <p class="price">السعر: 10 دنانير</p>
      <a href="https://wa.me/962700000000" target="_blank" class="btn">
        اطلب عبر واتساب
      </a>
    </div>

    <div class="product">
      <img src="images/product2.jpeg" alt="منتج 2">
      <h3>كفر موبايل أسد</h3>
      <p class="price">السعر: 15 دينار</p>
      <a href="https://wa.me/962700000000" target="_blank" class="btn">
        اطلب عبر واتساب
      </a>
    </div>

  </section>

  <!-- الفوتر -->
  <footer class="footer">
    <p>© 2026 SOS STORE - جميع الحقوق محفوظة</p>
  </footer>

</body>
</html>
